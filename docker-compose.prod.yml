# Uso:  docker compose -f docker-compose.prod.yml --env-file .env.prod <comando>
# (oppure: sh scripts/deploy.sh)
name: cartellow

x-laravel-env: &laravel-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?imposta APP_KEY in .env.prod}
  APP_URL: ${APP_URL:?imposta APP_URL in .env.prod}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:?imposta DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME:?imposta DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:?imposta DB_PASSWORD}
  MAIL_MAILER: smtp
  MAIL_HOST: ${MAIL_HOST:?imposta MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?imposta MAIL_FROM_ADDRESS}
  QUEUE_CONNECTION: database
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  CACHE_STORE: database

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    image: cartellow-api:latest
    restart: unless-stopped
    environment: *laravel-env
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  # Worker delle code (invio email in background)
  queue:
    image: cartellow-api:latest
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment: *laravel-env
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      - api

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?imposta APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?imposta ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Dump giornaliero del DB in ./backups (poi sincronizzalo FUORI dalla VM, vedi README)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./docker/backup/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  laravel_storage:
  caddy_data:
  caddy_config:
